[package]
name = "winui-gallery-browser"
description = "The browser host of the WinUI Gallery of FerroUI: the gallery as a WebAssembly module on a canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false

# A binary: the Emscripten target links wasm-bindgen exports only into executables. The host page
# (wwwroot/) creates the module and calls `runMain`; FerroUI/scripts/build-browser.sh with
# FERROUI_BROWSER_WORKSPACE assembles the site (docs/apps.md of FerroUI).
[[bin]]
name = "winui-gallery-browser"
path = "program.rs"

[dependencies]
# The gallery is the sample of the submodule, built from its sources. Its application class is part of
# its desktop and capture builds only; the application class of this host registers what that one
# does (the XAML types, the WinUI theme and the styles of the inking controls).
winui-gallery = { path = "../FerroUI/samples/WinUIGallery" }
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-controls-inking = { workspace = true }
ferroui-markup-xaml = { workspace = true }
ferroui-themes-winui = { workspace = true }
ferroui-browser = { workspace = true }
ferroui-fonts-inter = { workspace = true }
ferroui-markup-xaml-winui = { workspace = true }
wasm-bindgen = { workspace = true }
